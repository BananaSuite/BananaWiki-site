# Once a day: for every app in screenshots/apps.json whose repository has moved since its screenshots
# were taken, build that commit, capture the screenshots from a throwaway instance, update the pages
# and commit the result here. Apps without a capture module are only reported in the run's summary.
name: Screenshots

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Recapture every app that has a capture module, changed or not
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The apps' build scripts run in this job; the token is used only by the last step
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find apps to recapture
        id: find
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, subprocess, sys
          found = json.loads(subprocess.run([sys.executable, "screenshots/capture.py", "--outdated"],
                                            check=True, capture_output=True, text=True).stdout)
          if os.environ.get("FORCE") == "true":
              apps = json.load(open("screenshots/apps.json"))
              found["capture"] = [name for name, app in apps.items() if app["module"]]
          print("apps=" + " ".join(found["capture"]))
          print("no_module=" + " ".join(found["no_module"]))
          EOF

      - name: Report apps without a capture module
        if: steps.find.outputs.no_module != ''
        run: echo "No capture module yet, screenshots left as they are - ${{ steps.find.outputs.no_module }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v5
        if: steps.find.outputs.apps != ''
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-node@v4
        if: steps.find.outputs.apps != ''
        with:
          node-version: 24

      - name: Install the capture tools
        if: steps.find.outputs.apps != ''
        run: |
          npm install --global pnpm
          python3 -m pip install playwright pillow pyte pytest
          python3 -m playwright install --with-deps chromium

      - name: Build and capture
        if: steps.find.outputs.apps != ''
        env:
          APPS: ${{ steps.find.outputs.apps }}
        run: |
          for app in $APPS; do
            repo=$(python3 -c "import json,sys; print(json.load(open('screenshots/apps.json'))[sys.argv[1]]['repo'])" "$app")
            build=$(python3 -c "import json,sys; print(json.load(open('screenshots/apps.json'))[sys.argv[1]].get('build', ''))" "$app")
            src="$RUNNER_TEMP/$app"
            git clone --depth 1 "https://github.com/$repo.git" "$src"
            if [ -n "$build" ]; then (cd "$src" && bash -euo pipefail -c "$build"); fi
            python3 screenshots/capture.py "$app" --src "$src"
          done

      - name: Check the site
        if: steps.find.outputs.apps != ''
        run: python3 -m pytest -p no:cacheprovider tests

      - name: Commit the new screenshots
        if: steps.find.outputs.apps != ''
        env:
          APPS: ${{ steps.find.outputs.apps }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add -A img screenshots/apps.json '*.html'
          if git diff --cached --quiet; then
            echo "Nothing changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Recapture screenshots: $APPS"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          echo "Recaptured: $APPS" >> "$GITHUB_STEP_SUMMARY"
